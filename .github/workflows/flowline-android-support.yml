name: Build FlowLINE Android (Support)

on:
  # Build déclenché MANUELLEMENT (workflow_dispatch). Build self-hosted
  # (Pop!_OS 24.04 — même runner que Linux). Prérequis runner : Android SDK +
  # NDK r25c+ + targets rust android + cargo-ndk, installés par le playbook
  # flowline-runner-android-setup.yml (ANDROID_HOME / ANDROID_NDK_HOME via le
  # .env du runner).
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.12"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # FlowLINE white-label : serveurs de rendez-vous (séparés par virgule) + clé
  # publique. Déployer vers une autre infra = surcharger ces 2 vars (dispatch
  # manuel, champ "env" du job). Valeurs par défaut = infra falcon.
  RUSTDESK_RENDEZVOUS_SERVERS: "falcon.my-vth.ch"
  RUSTDESK_RS_PUB_KEY: "y7HFkRp6dnePO7+ehiUSpbhUIqAwnRYDdquULvqJQXg="
  FLOWLINE_API_SERVER: "https://api-falcon.my-vth.ch"
  # PAT org pour les clones git des dépendances privées (pubspec: rustdesk-org/*).
  GITHUB_TOKEN: ${{ secrets.FLOWLINE_GH_TOKEN }}

jobs:
  build-android-support:
    name: FlowLINE Support (arm64 + armeabi-v7a)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          # Repos privés (flowline-hbb-common...) : GITHUB_TOKEN du job ne voit
          # que le repo courant → PAT org (secret FLOWLINE_GH_TOKEN) pour les submodules.
          token: ${{ secrets.FLOWLINE_GH_TOKEN }}

      - name: Configure git credentials (deps git privées, pubspec rustdesk-org/*)
        # flutter pub get clone les deps git privées dans le cache pub (~/.pub-cache)
        # : le credential du checkout ne s'applique pas à ces clones → helper global.
        # GIT_CONFIG_GLOBAL = config job-only (ne touche pas au ~/.gitconfig).
        shell: bash
        run: |
          GITCFG="$RUNNER_TEMP/git-global.conf"
          git config --file "$GITCFG" credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'
          echo "GIT_CONFIG_GLOBAL=$GITCFG" >> "$GITHUB_ENV"

      - name: Guard - Android SDK/NDK + cargo-ndk (installation auto si absent)
        shell: bash
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME absent — lancer le playbook flowline-runner-android-setup.yml}"
          : "${ANDROID_NDK_HOME:?ANDROID_NDK_HOME absent — lancer le playbook flowline-runner-android-setup.yml}"
          # Les runs CI réinstallent rustup (dtolnay/rust-toolchain) et font
          # disparaître cargo-ndk de ~/.cargo/bin → réinstallation auto idempotente.
          if ! command -v cargo-ndk >/dev/null; then
            echo "cargo-ndk absent — installation (cargo install cargo-ndk 3.5.4)"
            cargo install cargo-ndk --locked --version 3.5.4
          fi
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk --version
          # NDK r25+ : pas de binaire ndk-version (source.properties à la place).
          grep 'Pkg.ReleaseName' "$ANDROID_NDK_HOME/source.properties"

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          # Idempotent : sur self-hosted le SDK Flutter est persisté dans le tool
          # cache entre les runs → le patch peut déjà être appliqué.
          if [[ "3.24.5" == "${{env.FLUTTER_VERSION}}" ]]; then
            if git apply --reverse --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
              echo "Patch déjà appliqué — skip"
            else
              git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            fi
          fi

      - name: Install Rust toolchain (android targets)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: linux-x64

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.tool_cache }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg android dependencies
        shell: bash
        run: |
          ./flutter/build_android_deps.sh arm64-v8a
          ./flutter/build_android_deps.sh armeabi-v7a

      - name: "Build rust .so (Support: feature quick-support)"
        # La variante Support force l'UI réduite incoming-only (feature cargo
        # `quick-support`, cross-platform). Les .so sont copiés dans jniLibs.
        shell: bash
        run: |
          # bindgen (magnum-opus, scrap, kcp-sys…) : sans target versionné + sysroot NDK,
          # il parse avec le clang hôte → stdint.h hôte incompatible (bits/libc-header-start).
          SYS="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android21 --sysroot=$SYS -I$SYS/usr/include/aarch64-linux-android"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--target=armv7a-linux-androideabi21 --sysroot=$SYS -I$SYS/usr/include/arm-linux-androideabi"
          cargo ndk --platform 21 -t arm64-v8a -t armeabi-v7a \
            -o flutter/android/app/src/main/jniLibs \
            build --locked --release --features flutter,hwcodec,quick-support
          # Le [lib] produit liblibrustdesk.so ; System.loadLibrary("rustdesk") attend librustdesk.so.
          mv flutter/android/app/src/main/jniLibs/arm64-v8a/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          mv flutter/android/app/src/main/jniLibs/armeabi-v7a/liblibrustdesk.so flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          ls -la flutter/android/app/src/main/jniLibs/arm64-v8a/ flutter/android/app/src/main/jniLibs/armeabi-v7a/

      - name: Strip native libs (taille APK)
        shell: bash
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            flutter/android/app/src/main/jniLibs/arm64-v8a/*.so
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            flutter/android/app/src/main/jniLibs/armeabi-v7a/*.so

      - name: Setup release signing (keystore local)
        # Keystore de PRODUCTION : ~/flowline-key.properties (hors repo) sur le runner
        # self-hosted → copié tel quel. Fallback si absent : keystore jetable (artefact
        # "unsigned", pour validation uniquement, JAMAIS de publication).
        shell: bash
        run: |
          if [ -f "$HOME/flowline-key.properties" ]; then
            cp "$HOME/flowline-key.properties" flutter/android/key.properties
            echo "OK: signature avec le keystore de production (local)"
          else
            KS="$HOME/flowline-android.keystore"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -alias flowline -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass flowline -keypass flowline \
                -dname "CN=FlowLINE, OU=StreamLINE, O=StreamLINE Solutions, C=CH" 2>/dev/null
            fi
            echo "storeFile=$HOME/flowline-android.keystore" > flutter/android/key.properties
            echo "storePassword=flowline" >> flutter/android/key.properties
            echo "keyPassword=flowline" >> flutter/android/key.properties
            echo "keyAlias=flowline" >> flutter/android/key.properties
            echo "WARN: keystore jetable (fallback) — pas de clé de production"
          fi

      - name: Build FlowLINE Support APK
        shell: bash
        working-directory: flutter
        run: |
          flutter precache --android
          flutter build apk --release --target-platform android-arm64,android-arm
          cp build/app/outputs/flutter-apk/app-release.apk flowline-support-${{ env.VERSION }}.apk

      - name: Build FlowLINE Support AAB (Play Store)
        shell: bash
        working-directory: flutter
        run: |
          flutter build appbundle --release --target-platform android-arm64,android-arm
          cp build/app/outputs/bundle/release/app-release.aab flowline-support-${{ env.VERSION }}.aab

      - name: Upload FlowLINE Support APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-support-android-${{ env.VERSION }}
          path: |
            flutter/flowline-support-${{ env.VERSION }}.apk
            flutter/flowline-support-${{ env.VERSION }}.aab
          retention-days: 30