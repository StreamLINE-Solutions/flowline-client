name: Diag FlowLINE Windows (temporaire 0097)

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  diag:
    name: Collect FlowLINE logs (VM win11)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Collect logs and restore WinRM
        run: |
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          $dirs = @(
            "$env:APPDATA\FlowLINE",
            "$env:APPDATA\RustDesk",
            "$env:LOCALAPPDATA\FlowLINE",
            "$env:LOCALAPPDATA\RustDesk"
          )
          foreach ($d in $dirs) {
            if (Test-Path $d) {
              $safe = ($d -replace '[:\\]', '_')
              Copy-Item -Recurse -Force $d "diag\$safe"
              Write-Output "collected: $d"
            } else {
              Write-Output "absent: $d"
            }
          }
          if (Test-Path "$env:USERPROFILE\flowline-win") {
            Get-ChildItem "$env:USERPROFILE\flowline-win" -Recurse -Include *.log,*.txt -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName "diag\deployed-$($_.Name)" }
          }
          Get-ChildItem diag -Recurse -File | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String | Write-Output
          try {
            Enable-PSRemoting -Force -SkipNetworkProfileCheck | Out-Null
            Write-Output "winrm re-enabled"
          } catch {
            Write-Output "winrm re-enable failed: $_"
          }

      - name: Upload diag artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-diag-win
          path: diag
          retention-days: 7