name: Build FlowLINE Windows x64

on:
  # Build déclenché MANUELLEMENT (workflow_dispatch) : le push sur main ne
  # rebuild plus Windows automatiquement (40 min par push). Lancer depuis
  # GitHub Actions → "Run workflow" → branche main quand un build est voulu.
  workflow_dispatch:

# F14 (audit 21/09) : moindre privilège — le GITHUB_TOKEN du run ne peut que lire.
permissions:
  contents: read

# Runner self-hosted (VM win11) : pas de PowerShell 7 → on force Windows
# PowerShell 5.1 (toujours présent) + ExecutionPolicy Bypass (la VM a une
# politique Restricted qui bloque le chargement du script d'étape).
defaults:
  run:
    shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"

env:
  SCITER_RUST_VERSION: "1.88"
  RUST_VERSION: "1.88"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.22"
  # FlowLINE white-label : serveurs de rendez-vous (séparés par virgule) + clé
  # publique. Déployer vers une autre infra = surcharger ces 2 vars (dispatch
  # manuel, champ "env" du job). Valeurs par défaut = infra falcon.
  RUSTDESK_RENDEZVOUS_SERVERS: "falcon.my-vth.ch"
  RUSTDESK_RS_PUB_KEY: "y7HFkRp6dnePO7+ehiUSpbhUIqAwnRYDdquULvqJQXg="
  # API compte FlowLINE (TLS via NPM). Surchargeable au dispatch.
  FLOWLINE_API_SERVER: "https://api-falcon.my-vth.ch"
  # 0086 : signature Authenticode via SSL.com OV + eSigner (cloud HSM). Gated
  # par la présence des 4 secrets ESIGNER_* : sans eux, build non signé
  # (comportement historique). Quota Tier 1 : 240 signatures/an → ne signer
  # que les artefacts livrés (MSI + one-file support), pas les builds de test.
  HAS_WIN_SIGNING: ${{ secrets.ESIGNER_USERNAME != '' && secrets.ESIGNER_PASSWORD != '' && secrets.ESIGNER_TOTP_SECRET != '' }}
  ESIGNER_MODE: "product"
  ESIGNER_CERT_NAME: "StreamLINE-Solutions Sàrl"
  # Audit 25/09 (0065) : plus de PAT en env workflow-level — limité aux steps
  # checkout + « Configure git credentials ».

jobs:
  build-windows-x64:
    name: FlowLINE + Support (x86_64-pc-windows-msvc)
    # Build self-hosted (Windows). Prérequis :
    # VS Build Tools (workload VCTools + Windows SDK). Un seul job build les 2
    # variantes en séquence (runner self-hosted = 1 job à la fois), le 2e build
    # profite du cache. Le bridge (flutter_rust_bridge) est commité.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Runner self-hosted persistant : NE PAS nettoyer le workspace, sinon
          # target/ (et build/ Flutter) sont effacés à chaque run → plus de
          # builds incrémentaux et il faudrait rust-cache (post-job ~8 min).
          clean: false
          # Repos privés (flowline-hbb-common...) : GITHUB_TOKEN du job ne voit
          # que le repo courant → PAT org (secret FLOWLINE_GH_TOKEN) pour les submodules.
          token: ${{ secrets.FLOWLINE_GH_TOKEN }}
          # Audit 25/09 (0065) : ne pas persister le PAT dans .git/config.
          persist-credentials: false

      # 7-Zip requis par install-llvm-action pour extraire LLVM. Préinstallé sur
      # GH hosted ; sur self-hosted l'installeur n'ajoute pas forcément le PATH.
      - name: Add 7-Zip and Git bash to PATH
        # 7-Zip requis par install-llvm-action ; Git\bin requis par les steps
        # shell:bash (bash.exe). Préinstallés sur GH hosted ; sur self-hosted
        # les installeurs winget n'ajoutent pas forcément ces dossiers au PATH.
        run: |
          if (Test-Path "C:\Program Files\7-Zip") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\7-Zip"
          } elseif (Test-Path "C:\Program Files (x86)\7-Zip") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\7-Zip"
          } else {
            throw "7-Zip not found - install via winget install --id 7zip.7zip"
          }
          if (Test-Path "C:\Program Files\Git\bin") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
          } else {
            throw "Git bin not found - install via winget install --id Git.Git"
          }

      - name: Defender exclusions (idempotent, accélère les builds)
        # Le service runner a un token complet (pas de filtrage UAC), contrairement
        # à WinRM. Réduit fortement l'overhead I/O de Defender sur cargo/vcpkg.
        # 0065 : limitées aux chemins/outils de build — les exclusions larges
        # (%TEMP%, git.exe, bash.exe, sh.exe) sont retirées à chaque run
        # (convergence idempotente).
        run: |
          $legacyPaths = @('C:\Users\User\AppData\Local\Temp')
          foreach ($p in $legacyPaths) { Remove-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue }
          $legacyProcs = @('git.exe','bash.exe','sh.exe')
          foreach ($p in $legacyProcs) { Remove-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue }
          $paths = @(
            'C:\actions-runner',
            'C:\Users\User\.cargo',
            'C:\Users\User\.rustup',
            'C:\Users\User\.nuget',
            'C:\Program Files\LLVM'
          )
          foreach ($p in $paths) { Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue }
          $procs = @(
            'rustc.exe','cargo.exe','cl.exe','link.exe','cmake.exe','ninja.exe',
            'vcpkg.exe','dart.exe','gen_snapshot.exe'
          )
          foreach ($p in $procs) { Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue }
          "Exclusions Defender actives (paths) :"
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
          "Exclusions Defender actives (procs) :"
          Get-MpPreference | Select-Object -ExpandProperty ExclusionProcess

      - name: Nettoyage des artefacts du run précédent
        # clean: false → le workspace persiste. On retire les sorties non
        # rejouables (mv/Expand-Archive échouent si la cible existe) avant de
        # rebuilder ; target/ et flutter/build/ restent pour l'incrémental.
        run: |
          $items = @(
            'windows-x64-release.zip',
            'windows-x64-release',
            'rustdesk',
            'rustdesk-support',
            "flowline-${{ env.VERSION }}-x86_64.msi",
            "flowline-support-${{ env.VERSION }}-onefile.exe"
          )
          foreach ($i in $items) {
            if (Test-Path $i) { Remove-Item -Recurse -Force $i }
          }

      - name: Runner — démarrage auto au boot (tâche planifiée, idempotent)
        # Le package runner 2.337 n'a plus svc.cmd. Tâche ONLOGON (autologon
        # actif) exécutée avec le token complet de User (/RL HIGHEST) via un
        # VBS qui cache la fenêtre. /IT = pas de mot de passe stocké.
        run: |
          $vbs = @(
            'Set sh = CreateObject("WScript.Shell")',
            'sh.Run "cmd /c C:\actions-runner\run.cmd", 0, False'
          )
          Set-Content -Path C:\actions-runner\run-hidden.vbs -Value $vbs -Encoding ASCII
          schtasks /Create /TN "GitHubRunner" /TR "wscript.exe C:\actions-runner\run-hidden.vbs" /SC ONLOGON /RU "$env:COMPUTERNAME\$env:USERNAME" /IT /RL HIGHEST /F
          schtasks /Query /TN "GitHubRunner" /FO LIST | Select-String -Pattern 'Nom de la tâche|TaskName|Statut|Status'

      - name: Configure git credentials (deps git privées, pubspec rustdesk-org/*)
        # Sur GH hosted un credential helper global existe ; pas sur self-hosted.
        # GIT_CONFIG_GLOBAL = config job-only (ne touche pas au ~/.gitconfig).
        # Audit 25/09 (0065) : PAT limité à ce step (plus d'env workflow-level).
        env:
          GITHUB_TOKEN: ${{ secrets.FLOWLINE_GH_TOKEN }}
        shell: bash
        run: |
          GITCFG="$RUNNER_TEMP/git-global.conf"
          git config --file "$GITCFG" credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'
          echo "GIT_CONFIG_GLOBAL=$GITCFG" >> "$GITHUB_ENV"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      # Toolchain CMake + Ninja (GH hosted les préinstalle, self-hosted non) :
      # installés dans le tool cache, sans admin.
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1

      # Python réel (GH hosted préinstallé, self-hosted non) — build.py stdlib only.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # jq requis par subosito/flutter-action (setup.sh). Préinstallé sur GH hosted.
      # 0066 : téléchargement vérifié par SHA256 (fail-closed).
      - name: Install jq
        run: |
          $jqDir = Join-Path $env:RUNNER_TEMP "jq"
          New-Item -ItemType Directory -Force -Path $jqDir | Out-Null
          $jqExe = Join-Path $jqDir "jq.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe" -OutFile $jqExe
          $sha = (Get-FileHash -Algorithm SHA256 $jqExe).Hash.ToLower()
          if ($sha -ne "7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab") { throw "SHA256 jq invalide : $sha" }
          Add-Content -Path $env:GITHUB_PATH -Value $jqDir

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        # Chemin du SDK Flutter via RUNNER_TOOL_CACHE (hostedtoolcache sur GH
        # hosted, _work/_tool sur self-hosted) — plus de chemin hardcodé.
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          # 0066 : SHA256 figé — le tag amont "main" est mouvant, donc fail-closed.
          # Si le build casse ici, l'amont a republié : re-télécharger, vérifier,
          # mettre à jour le hash ci-dessous.
          $sha = (Get-FileHash -Algorithm SHA256 windows-x64-release.zip).Hash.ToLower()
          if ($sha -ne "ec8cabf36ee4ff24c8d98de25b00e70781eb03876265aee84d0fe554a110036e") { throw "SHA256 engine invalide : $sha" }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "$env:RUNNER_TOOL_CACHE\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release"
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Copy-Item -Force -Recurse -Path "windows-x64-release\*" -Destination $engineDir

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          # Idempotent : sur self-hosted le SDK Flutter est persisté dans le tool
          # cache entre les runs → le patch peut déjà être appliqué.
          if [[ "3.24.5" == "${{env.FLUTTER_VERSION}}" ]]; then
            if git apply --reverse --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
              echo "Patch déjà appliqué — skip"
            else
              git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            fi
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg (tool cache persistant, sans mise à jour)
        # Remplace lukka/run-vcpkg : l'action refaisait un fetch/checkout du
        # commit pinné + bootstrap (15 min silencieuses sous Defender) et son
        # backend de cache x-gha n'existe plus. Le tool cache du runner
        # persiste déjà vcpkg.exe + installed/ (packages précompilés).
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TOOL_CACHE "vcpkg"
          if (-not (Test-Path (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            throw "vcpkg.exe absent du tool cache ($vcpkgRoot)"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_DEFAULT_TRIPLET=x64-windows-static"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_DEFAULT_HOST_TRIPLET=x64-windows-static"
          & (Join-Path $vcpkgRoot "vcpkg.exe") version

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      # MSVC (cl/link) : GH hosted a l'env dans le PATH, le self-hosted non →
      # active VS Build Tools (vswhere) pour ce job.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Build FlowLINE (technicien)
        env:
          FLOWLINE_QUICK_SUPPORT: "0"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          # msvc-dev-cmd a réécrit VCPKG_ROOT vers le vcpkg embarqué de VS Build
          # Tools (ffmpeg absent) → on le re-pointe vers notre vcpkg (tool cache).
          $env:VCPKG_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg"
          $env:VCPKG_INSTALLED_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg\installed"
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      # ---- MSI (task 0035, Option A « build Windows 100 % CI ») ----
      # Pattern upstream rustdesk (flutter-build.yml) : preprocess.py (branding +
      # composants WiX auto) → nuget restore (WixToolset 4.0.5 + WcaUtil/DUtil) →
      # msbuild. L'icône res/msi/icon.ico est copiée dans Package/Resources par
      # preprocess.py (dossier git-ignoré) ; les bitmaps du wizard sont versionnés.
      - name: Setup NuGet (restore WiX)
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
        with:
          nuget-version: latest

      - name: Set up MSBuild (WiX msi.sln)
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build FlowLINE MSI (WiX 4)
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name FlowLINE -v ${{ env.VERSION }} -m "StreamLINE Solutions"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          if (-not $msi) { throw "Package.msi introuvable après msbuild (res/msi)" }
          Copy-Item -Force $msi.FullName ./flowline-${{ env.VERSION }}-x86_64.msi
          Get-FileHash ./flowline-${{ env.VERSION }}-x86_64.msi -Algorithm SHA256 | Format-List

      - name: Build FlowLINE Support (QuickSupport)
        env:
          FLOWLINE_QUICK_SUPPORT: "1"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg"
          $env:VCPKG_INSTALLED_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg\installed"
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk-support
          mv ./rustdesk-support/flowline.exe ./rustdesk-support/flowline-support.exe

      - name: Pack FlowLINE Support one-file (brotli + portable-packer)
        run: |
          python -m pip install -r libs/portable/requirements.txt
          python libs/portable/generate.py -f ./rustdesk-support -o libs/portable -e ./rustdesk-support/flowline-support.exe
          cargo build -p rustdesk-portable-packer --release
          Copy-Item -Force ./target/release/rustdesk-portable-packer.exe ./flowline-support-${{ env.VERSION }}-onefile.exe
          Get-FileHash ./flowline-support-${{ env.VERSION }}-onefile.exe -Algorithm SHA256 | Format-List

      # ---- Signature Authenticode (0086) : SSL.com OV + eSigner Cloud ----
      # Gated par HAS_WIN_SIGNING (secrets ESIGNER_*) : sans secrets, les steps
      # sont sautés et les artefacts restent non signés.
      # CKA 1.1.2 (SSL.com) : le master.key est généré localement par `config -r`
      # (pas de secret à fournir) ; `load`/`unload` seuls (pas d'arguments) ;
      # le certificat est ensuite sélectionné par thumbprint (subject StreamLINE).
      - name: Install eSigner CKA (SSL.com cloud signing)
        if: env.HAS_WIN_SIGNING == 'true'
        env:
          ESIGNER_CKA_URL: "https://github.com/SSLcom/eSignerCKA/releases/download/v1.1.2/SSL.COM.eSigner.CKA_1.1.2_build_202600624.exe"
          ESIGNER_CKA_SHA256: "3f088403139505ddfb0ed3b56b72893f92c865f98b382753a1e1c695a5cece35"
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri $env:ESIGNER_CKA_URL -OutFile "$env:RUNNER_TEMP\eSigner_CKA_Installer.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\eSigner_CKA_Installer.exe" -Algorithm SHA256).Hash
          if ($hash -ne $env:ESIGNER_CKA_SHA256.ToUpper()) { throw "SHA256 installeur CKA invalide : $hash" }
          $ckaDir = Join-Path $env:LOCALAPPDATA 'eSignerCKA'
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\eSigner_CKA_Installer.exe" -ArgumentList '/CURRENTUSER','/VERYSILENT',"/DIR=$ckaDir"
          $cka = Join-Path $ckaDir 'eSignerCKATool.exe'
          if (-not (Test-Path $cka)) { throw "eSignerCKATool.exe introuvable après installation : $cka" }
          Add-Content -Path $env:GITHUB_ENV -Value "ESIGNER_CKA=$cka"

      - name: Configure eSigner CKA (automated) and load certificate
        if: env.HAS_WIN_SIGNING == 'true'
        # Le TOTP secret (secret code de l'enrôlement eSigner) permet la
        # génération automatique des codes 2FA (mode automatisé, pas d'OTP
        # interactif). Le master.key est généré localement (-r) et supprimé en
        # fin de job (runner persistant).
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $masterKey = Join-Path $env:RUNNER_TEMP 'esigner-master.key'
          & $env:ESIGNER_CKA config -mode $env:ESIGNER_MODE -user $env:ESIGNER_USERNAME -pass $env:ESIGNER_PASSWORD -totp $env:ESIGNER_TOTP_SECRET -key $masterKey -r
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA config échoué ($LASTEXITCODE)" }
          & $env:ESIGNER_CKA unload 2>$null
          & $env:ESIGNER_CKA load
          if ($LASTEXITCODE -ne 0) { throw "eSigner CKA load échoué ($LASTEXITCODE)" }
          $tp = (Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert |
            Where-Object { $_.Subject -like "*StreamLINE-Solutions*" } |
            Sort-Object NotAfter -Descending | Select-Object -First 1).Thumbprint
          if (-not $tp) { throw "Thumbprint du certificat eSigner introuvable" }
          Add-Content -Path $env:GITHUB_ENV -Value "ESIGNER_THUMBPRINT=$tp"

      - name: Sign MSI + one-file (Authenticode, horodatage RFC3161)
        if: env.HAS_WIN_SIGNING == 'true'
        # Piège connu : timestamp ECDSA → si « minimum public key length »,
        # utiliser http://ts.ssl.com/legacy (RSA).
        run: |
          $files = @(
            "flowline-${{ env.VERSION }}-x86_64.msi",
            "flowline-support-${{ env.VERSION }}-onefile.exe"
          )
          foreach ($f in $files) {
            signtool sign /fd sha256 /tr http://ts.ssl.com /td sha256 /sha1 $env:ESIGNER_THUMBPRINT $f
            if ($LASTEXITCODE -ne 0) { throw "signtool sign a échoué : $f" }
            signtool verify /pa $f
            if ($LASTEXITCODE -ne 0) { throw "signtool verify a échoué : $f" }
          }

      - name: Cleanup eSigner (master.key + unload)
        # Runner self-hosted persistant : ne pas laisser le master.key, et
        # décharger le certificat du store utilisateur.
        if: always() && env.HAS_WIN_SIGNING == 'true'
        run: |
          $masterKey = Join-Path $env:RUNNER_TEMP 'esigner-master.key'
          if ($env:ESIGNER_CKA -and (Test-Path $env:ESIGNER_CKA)) {
            & $env:ESIGNER_CKA unload 2>$null
          }
          if (Test-Path $masterKey) { Remove-Item -Force $masterKey }

      - name: Upload FlowLINE artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-windows-x64-${{ env.VERSION }}
          path: rustdesk
          retention-days: 30

      - name: Upload FlowLINE Support artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-support-windows-x64-${{ env.VERSION }}
          path: rustdesk-support
          retention-days: 30

      - name: Upload FlowLINE MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-msi-${{ env.VERSION }}
          path: flowline-${{ env.VERSION }}-x86_64.msi
          retention-days: 30

      - name: Upload FlowLINE Support one-file artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-support-onefile-${{ env.VERSION }}
          path: flowline-support-${{ env.VERSION }}-onefile.exe
          retention-days: 30

      - name: Cleanup git credentials (PAT hors fichier temporaire)
        # Audit 25/09 (0065) : runner self-hosted persistant — ne pas laisser le
        # PAT dans $RUNNER_TEMP/git-global.conf.
        if: always()
