name: Build FlowLINE Windows x64

on:
  # Build déclenché MANUELLEMENT (workflow_dispatch) : le push sur main ne
  # rebuild plus Windows automatiquement (40 min par push). Lancer depuis
  # GitHub Actions → "Run workflow" → branche main quand un build est voulu.
  workflow_dispatch:

# Runner self-hosted (VM win11) : pas de PowerShell 7 → on force Windows
# PowerShell 5.1 (toujours présent) + ExecutionPolicy Bypass (la VM a une
# politique Restricted qui bloque le chargement du script d'étape).
defaults:
  run:
    shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.12"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # FlowLINE white-label : serveurs de rendez-vous (séparés par virgule) + clé
  # publique. Déployer vers une autre infra = surcharger ces 2 vars (dispatch
  # manuel, champ "env" du job). Valeurs par défaut = infra falcon.
  RUSTDESK_RENDEZVOUS_SERVERS: "falcon.my-vth.ch"
  RUSTDESK_RS_PUB_KEY: "y7HFkRp6dnePO7+ehiUSpbhUIqAwnRYDdquULvqJQXg="
  # API compte FlowLINE (TLS via NPM). Surchargeable au dispatch.
  FLOWLINE_API_SERVER: "https://api-falcon.my-vth.ch"
  # PAT org pour les clones git des dépendances privées (pubspec: rustdesk-org/*).
  GITHUB_TOKEN: ${{ secrets.FLOWLINE_GH_TOKEN }}

jobs:
  build-windows-x64:
    name: FlowLINE + Support (x86_64-pc-windows-msvc)
    # Build self-hosted (Windows). Prérequis :
    # VS Build Tools (workload VCTools + Windows SDK). Un seul job build les 2
    # variantes en séquence (runner self-hosted = 1 job à la fois), le 2e build
    # profite du cache. Le bridge (flutter_rust_bridge) est commité.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          # Repos privés (flowline-hbb-common...) : GITHUB_TOKEN du job ne voit
          # que le repo courant → PAT org (secret FLOWLINE_GH_TOKEN) pour les submodules.
          token: ${{ secrets.FLOWLINE_GH_TOKEN }}

      # 7-Zip requis par install-llvm-action pour extraire LLVM. Préinstallé sur
      # GH hosted ; sur self-hosted l'installeur n'ajoute pas forcément le PATH.
      - name: Add 7-Zip and Git bash to PATH
        # 7-Zip requis par install-llvm-action ; Git\bin requis par les steps
        # shell:bash (bash.exe). Préinstallés sur GH hosted ; sur self-hosted
        # les installeurs winget n'ajoutent pas forcément ces dossiers au PATH.
        run: |
          if (Test-Path "C:\Program Files\7-Zip") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\7-Zip"
          } elseif (Test-Path "C:\Program Files (x86)\7-Zip") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\7-Zip"
          } else {
            throw "7-Zip not found - install via winget install --id 7zip.7zip"
          }
          if (Test-Path "C:\Program Files\Git\bin") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
          } else {
            throw "Git bin not found - install via winget install --id Git.Git"
          }

      - name: Configure git credentials (deps git privées, pubspec rustdesk-org/*)
        # Sur GH hosted un credential helper global existe ; pas sur self-hosted.
        # GIT_CONFIG_GLOBAL = config job-only (ne touche pas au ~/.gitconfig).
        shell: bash
        run: |
          GITCFG="$RUNNER_TEMP/git-global.conf"
          git config --file "$GITCFG" credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'
          echo "GIT_CONFIG_GLOBAL=$GITCFG" >> "$GITHUB_ENV"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      # Toolchain CMake + Ninja (GH hosted les préinstalle, self-hosted non) :
      # installés dans le tool cache, sans admin.
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1

      # Python réel (GH hosted préinstallé, self-hosted non) — build.py stdlib only.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # jq requis par subosito/flutter-action (setup.sh). Préinstallé sur GH hosted.
      - name: Install jq
        run: |
          $jqDir = Join-Path $env:RUNNER_TEMP "jq"
          New-Item -ItemType Directory -Force -Path $jqDir | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe" -OutFile (Join-Path $jqDir "jq.exe")
          Add-Content -Path $env:GITHUB_PATH -Value $jqDir

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        # Chemin du SDK Flutter via RUNNER_TOOL_CACHE (hostedtoolcache sur GH
        # hosted, _work/_tool sur self-hosted) — plus de chemin hardcodé.
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "$env:RUNNER_TOOL_CACHE\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release"
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Copy-Item -Force -Recurse -Path "windows-x64-release\*" -Destination $engineDir

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          # Idempotent : sur self-hosted le SDK Flutter est persisté dans le tool
          # cache entre les runs → le patch peut déjà être appliqué.
          if [[ "3.24.5" == "${{env.FLUTTER_VERSION}}" ]]; then
            if git apply --reverse --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
              echo "Patch déjà appliqué — skip"
            else
              git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            fi
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.tool_cache }}\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      # MSVC (cl/link) : GH hosted a l'env dans le PATH, le self-hosted non →
      # active VS Build Tools (vswhere) pour ce job.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Build FlowLINE (technicien)
        env:
          FLOWLINE_QUICK_SUPPORT: "0"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          # msvc-dev-cmd a réécrit VCPKG_ROOT vers le vcpkg embarqué de VS Build
          # Tools (ffmpeg absent) → on le re-pointe vers notre vcpkg (tool cache).
          $env:VCPKG_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg"
          $env:VCPKG_INSTALLED_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg\installed"
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      # ---- MSI (task 0035, Option A « build Windows 100 % CI ») ----
      # Pattern upstream rustdesk (flutter-build.yml) : preprocess.py (branding +
      # composants WiX auto) → nuget restore (WixToolset 4.0.5 + WcaUtil/DUtil) →
      # msbuild. L'icône res/msi/icon.ico est copiée dans Package/Resources par
      # preprocess.py (dossier git-ignoré) ; les bitmaps du wizard sont versionnés.
      - name: Setup NuGet (restore WiX)
        uses: NuGet/setup-nuget@6dce1b473349006b8fb850548eb7c04c0a56fa0b # v2
        with:
          nuget-version: latest

      - name: Set up MSBuild (WiX msi.sln)
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build FlowLINE MSI (WiX 4)
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name flowline -v ${{ env.VERSION }} -m "StreamLINE Solutions"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          if (-not $msi) { throw "Package.msi introuvable après msbuild (res/msi)" }
          Copy-Item -Force $msi.FullName ./flowline-${{ env.VERSION }}-x86_64.msi
          Get-FileHash ./flowline-${{ env.VERSION }}-x86_64.msi -Algorithm SHA256 | Format-List

      - name: Build FlowLINE Support (QuickSupport)
        env:
          FLOWLINE_QUICK_SUPPORT: "1"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg"
          $env:VCPKG_INSTALLED_ROOT = "$env:RUNNER_TOOL_CACHE\vcpkg\installed"
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk-support
          mv ./rustdesk-support/flowline.exe ./rustdesk-support/flowline-support.exe

      - name: Pack FlowLINE Support one-file (brotli + portable-packer)
        run: |
          python -m pip install -r libs/portable/requirements.txt
          python libs/portable/generate.py -f ./rustdesk-support -o libs/portable -e ./rustdesk-support/flowline-support.exe
          cargo build -p rustdesk-portable-packer --release
          Copy-Item -Force ./target/release/rustdesk-portable-packer.exe ./flowline-support-${{ env.VERSION }}-onefile.exe
          Get-FileHash ./flowline-support-${{ env.VERSION }}-onefile.exe -Algorithm SHA256 | Format-List

      - name: Upload FlowLINE artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-unsigned-windows-x64-${{ env.VERSION }}
          path: rustdesk
          retention-days: 30

      - name: Upload FlowLINE Support artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-support-unsigned-windows-x64-${{ env.VERSION }}
          path: rustdesk-support
          retention-days: 30

      - name: Upload FlowLINE MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-msi-${{ env.VERSION }}
          path: flowline-${{ env.VERSION }}-x86_64.msi
          retention-days: 30

      - name: Upload FlowLINE Support one-file artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-support-onefile-${{ env.VERSION }}
          path: flowline-support-${{ env.VERSION }}-onefile.exe
          retention-days: 30