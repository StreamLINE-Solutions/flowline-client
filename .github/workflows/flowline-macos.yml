name: Build FlowLINE macOS

on:
  # Déclenchement manuel uniquement (process release).
  # Depuis 0081 : arm64 ET x86_64 (cross-compilé) sur runner self-hosted
  # Mac mini (0 min GitHub, caches cargo/vcpkg locaux persistants).
  workflow_dispatch:

# F14 (audit 21/09) : moindre privilège — le GITHUB_TOKEN du run ne peut que lire.
permissions:
  contents: read

env:
  MAC_RUST_VERSION: "1.88"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.21"
  # Xcode 27 : `strip = true` (profil release) produit des Mach-O corrompus
  # (« mis-aligned LINKEDIT string pool ») — la dylib proc-macro cidre_macros
  # devient illisible (E0463) et le build aarch64 échoue. Strip désactivé en CI
  # (bug Apple ld/strip) ; cf. ticket 0081. À réévaluer après mise à jour Xcode.
  CARGO_PROFILE_RELEASE_STRIP: "none"
  # bindgen doit charger le libclang de Xcode, pas celui de Homebrew LLVM :
  # `llvm-config` est dans le PATH du runner et clang-sys découvre ainsi
  # /opt/homebrew/opt/llvm (23.x). Avec ce libclang, les bindings x86_64
  # cross-compilés sont corrompus (structs cfg vpx/aom rendues opaques → E0609).
  LIBCLANG_PATH: "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # FlowLINE white-label : serveurs de rendez-vous (séparés par virgule) + clé
  # publique. Déployer vers une autre infra = surcharger ces 2 vars. Défaut falcon.
  RUSTDESK_RENDEZVOUS_SERVERS: "falcon.my-vth.ch"
  RUSTDESK_RS_PUB_KEY: "y7HFkRp6dnePO7+ehiUSpbhUIqAwnRYDdquULvqJQXg="
  FLOWLINE_API_SERVER: "https://api-falcon.my-vth.ch"
  # Audit 25/09 (0065) : plus de PAT en env workflow-level — limité aux steps
  # checkout + « Configure git credentials ».

jobs:
  build-macos:
    name: ${{ matrix.job.target }}
    # Le bridge (flutter_rust_bridge) est commité : plus de job generate-bridge.
    runs-on: ${{ matrix.job.os }}
    env:
      # Signature Developer ID + notarisation activées dès que les 6 secrets
      # existent ; sinon signature ad hoc (comportement historique, DMG non notarisé).
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_API_KEY_P8 != '' }}
      SIGN_IDENTITY: "Developer ID Application: StreamLINE-Solutions Sarl (DSGXA9V62W)"
    strategy:
      fail-fast: false
      matrix:
        job:
          # 0081 : les DEUX arches sur runner self-hosted (Mac mini M6, Venthone) — 0 min GitHub.
          # x86_64 est cross-compilé depuis arm64 (cargo --target + FLUTTER_XCODE_ARCHS).
          - { target: x86_64-apple-darwin, os: [self-hosted, macOS, ARM64, mac-mini], extra-build-args: "--mac-target x86_64-apple-darwin", arch: x86_64, vcpkg_triplet: x64-osx }
          - { target: aarch64-apple-darwin, os: [self-hosted, macOS, ARM64, mac-mini], extra-build-args: "--mac-target aarch64-apple-darwin --screencapturekit", arch: aarch64, vcpkg_triplet: arm64-osx }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup local build cache (runner persistant)
        # Runner self-hosté : cache cargo persistant hors workspace (survit au
        # `git clean` du checkout) → builds incrémentaux. Sur GitHub-hosted,
        # RUNNER_TOOL_CACHE est éphémère (pas de gain, pas de casse).
        shell: bash
        run: |
          CACHE_ROOT="${RUNNER_TOOL_CACHE:-$HOME/.cache}/flowline-cache"
          mkdir -p "$CACHE_ROOT"
          echo "CARGO_TARGET_DIR=$CACHE_ROOT/cargo" >> "$GITHUB_ENV"

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Repos privés (flowline-hbb-common...) : GITHUB_TOKEN du job ne voit
          # que le repo courant → PAT org (secret FLOWLINE_GH_TOKEN) pour les submodules.
          token: ${{ secrets.FLOWLINE_GH_TOKEN }}
          # Audit 25/09 (0065) : ne pas persister le PAT dans .git/config.
          persist-credentials: false

      - name: Configure git credentials (deps git privées, pubspec rustdesk-org/*)
        # flutter pub get clone les deps git privées dans le cache pub (~/.pub-cache)
        # : le credential du checkout ne s'applique pas à ces clones → helper global.
        # GIT_CONFIG_GLOBAL = config job-only (ne touche pas au ~/.gitconfig).
        # Audit 25/09 (0065) : PAT limité à ce step (plus d'env workflow-level).
        env:
          GITHUB_TOKEN: ${{ secrets.FLOWLINE_GH_TOKEN }}
        shell: bash
        run: |
          GITCFG="$RUNNER_TEMP/git-global.conf"
          git config --file "$GITCFG" credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'
          echo "GIT_CONFIG_GLOBAL=$GITCFG" >> "$GITHUB_ENV"

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          # 0066 : SHA256 figé (fail-closed).
          echo "0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75  nasm-2.16.03-macosx.zip" | shasum -a 256 -c -
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          # Le PATH du runner peut contenir un autre nasm (Homebrew 3.x, incompatible aom) :
          # forcer /usr/local/bin en tête pour les étapes suivantes (aom/ffmpeg x86_64).
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /usr/local/bin/nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          # SDK Flutter persistant (tool cache du runner self-hosté) : repartir d'un état
          # propre, sinon git apply échoue au 2e job (patch déjà appliqué par le 1er).
          git checkout -- .
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        # Self-hosted : cache cargo local persistant (CARGO_TARGET_DIR) — inutile
        # d'uploader target/ vers le cache GitHub. Conservé pour le fallback hosted.
        if: runner.environment != 'self-hosted'
        with:
          prefix-key: ${{ matrix.job.target }}
          # cache-bin: rust-cache nettoie ~/.cargo/bin au post-job et supprime
          # rustup/cargo-ndk installés pendant le run (cassait cargo en local).
          cache-bin: false

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          # Cache binaire géré localement dans l'étape suivante (persistant sur le
          # runner self-hosted, partagé entre arches) — plus de cache GitHub.
          doNotCache: true

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.job.vcpkg_triplet }}
        run: |
          CACHE_ROOT="${RUNNER_TOOL_CACHE:-$HOME/.cache}/flowline-cache"
          export VCPKG_BINARY_SOURCES="clear;files,$CACHE_ROOT/vcpkg-bincache,readwrite"
          mkdir -p "$CACHE_ROOT/vcpkg-bincache"
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg_triplet }}-rel-out.log" || true

      - name: Import Developer ID certificate
        # .p12 importé dans un keychain temporaire (supprimé par le Cleanup en fin de job).
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/build_certificate.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Secrets saisis via l'UI GitHub : retirer les \r\n parasites eventuels
          # (un saut de ligne final invalide le mot de passe p12 / les IDs notarytool).
          BUILD_CERTIFICATE_BASE64="$(printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n')"
          P12_PASSWORD="$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')"
          KEYCHAIN_PASSWORD="$(printf '%s' "$KEYCHAIN_PASSWORD" | tr -d '\r\n')"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Build FlowLINE (technicien)
        env:
          FLOWLINE_QUICK_SUPPORT: "0"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          # Xcode 27 refuse tout deployment target < 12.0 (plage 12.0–27.0) :
          # les deux arches sont alignées sur 12.3 (min x86_64 relevé de 10.14).
          # Les cibles Pods (podspecs Flutter à 10.14) sont forcées à 12.3 par
          # le post_install du Podfile. Cf. ticket 0081.
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Codesign Developer ID (technicien)
        # Signature inside-out : frameworks/dylibs, puis binaires, puis l'app avec
        # entitlements (hardened runtime + timestamp requis pour la notarisation).
        # --keychain explicite : sur ce runner, codesign ne résout pas l'identité via
        # la search list (errSecInternalComponent sinon).
        if: env.HAS_SIGNING == 'true'
        env:
          APP: ./flutter/build/macos/Build/Products/Release/FlowLINE.app
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          for item in "$APP"/Contents/Frameworks/*.framework "$APP"/Contents/Frameworks/*.dylib; do
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" "$item"
          done
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" "$APP/Contents/MacOS/service"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" \
            --entitlements flutter/macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier"

      - name: Codesign ad hoc (technicien, sans secrets)
        # Signature uniforme du bundle : sans elle, binaire principal ad hoc + framework
        # FlutterMacOS signé Google → crash dyld arm64 "different Team IDs" + Gatekeeper
        # « endommagée ». Ad hoc = non notarisé : l'utilisateur passe par clic droit → Ouvrir.
        # (Notarisation Developer ID : voir notes/FlowLINE-macOS-signature-analyse.md.)
        if: env.HAS_SIGNING != 'true'
        env:
          APP: ./flutter/build/macos/Build/Products/Release/FlowLINE.app
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: create dmg (technicien)
        # --skip-jenkins : pas d'AppleScript Finder (TCC Automation indisponible sur le
        # runner → « Délai dépassé pour un AppleEvent » -1712). Pas de mise en page custom.
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --skip-jenkins --icon "FlowLINE.app" 200 190 --hide-extension "FlowLINE.app" --window-size 800 400 --app-drop-link 600 185 "flowline-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg" ./flutter/build/macos/Build/Products/Release/FlowLINE.app

      - name: Sign, notarize and staple dmg (technicien)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          DMG: flowline-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          # IDs saisis via l'UI GitHub : retirer les \r\n parasites eventuels.
          ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '\r\n')"
          ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '\r\n')"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          codesign --force --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Build FlowLINE Support (QuickSupport)
        # Variante Support : feature cargo `quick-support` (incoming-only, UI réduite) —
        # cross-platform (hbb_common), le dmg suffit sur macOS (pas de packer one-file).
        # Profite du cache cargo/flutter du build technicien (recompilation partielle).
        env:
          FLOWLINE_QUICK_SUPPORT: "1"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Codesign Developer ID (Support)
        # Rebuild Support écrase le même chemin de sortie → re-signature obligatoire.
        if: env.HAS_SIGNING == 'true'
        env:
          APP: ./flutter/build/macos/Build/Products/Release/FlowLINE.app
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: |
          for item in "$APP"/Contents/Frameworks/*.framework "$APP"/Contents/Frameworks/*.dylib; do
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" "$item"
          done
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" "$APP/Contents/MacOS/service"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" \
            --entitlements flutter/macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Codesign ad hoc (Support, sans secrets)
        # Rebuild Support écrase le même chemin de sortie → re-signature obligatoire.
        if: env.HAS_SIGNING != 'true'
        env:
          APP: ./flutter/build/macos/Build/Products/Release/FlowLINE.app
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: create dmg (Support)
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --skip-jenkins --icon "FlowLINE.app" 200 190 --hide-extension "FlowLINE.app" --window-size 800 400 --app-drop-link 600 185 "flowline-support-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg" ./flutter/build/macos/Build/Products/Release/FlowLINE.app

      - name: Sign, notarize and staple dmg (Support)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
          DMG: flowline-support-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          # IDs saisis via l'UI GitHub : retirer les \r\n parasites eventuels.
          ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '\r\n')"
          ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '\r\n')"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          codesign --force --timestamp --keychain "$KEYCHAIN_PATH" -s "$SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Upload unsigned macOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-unsigned-macos-${{ matrix.job.arch }}-${{ env.VERSION }}
          path: "flowline-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg"
          retention-days: 30

      - name: Upload FlowLINE Support artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-support-unsigned-macos-${{ matrix.job.arch }}-${{ env.VERSION }}
          path: "flowline-support-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg"
          retention-days: 30

      - name: Cleanup signing keychain (runner self-hosté)
        # Le runner persiste entre les jobs : ne jamais laisser le keychain temporaire,
        # le .p12 ou la clé API sur disque.
        if: always() && env.HAS_SIGNING == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Cleanup git credentials (PAT hors fichier temporaire)
        # Audit 25/09 (0065) : runner self-hosted persistant — ne pas laisser le
        # PAT dans $RUNNER_TEMP/git-global.conf.
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/git-global.conf"