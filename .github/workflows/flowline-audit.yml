name: Audit dépendances FlowLINE

on:
  # Hard fork (ticket 0112, décision 20.10) : le scan devient CONTINU — hebdomadaire.
  # Un audit ponctuel ne couvre pas les CVE publiées entre deux passages.
  # Les runs planifiés nécessitent un runner self-hosted en ligne (sinon restent en file).
  schedule:
    - cron: "23 6 * * 1" # lundi 06:23 UTC (08:23 CEST)
  # Audit à la demande.
  workflow_dispatch:

# F14 (audit 21/09) : moindre privilège — le GITHUB_TOKEN du run ne peut que lire.
permissions:
  contents: read

env:
  # Audit 25/09 (0066) : épinglé par digest (index multi-arch) — le tag v2 est mutable.
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa

jobs:
  audit:
    name: osv-scanner (Cargo.lock + pubspec.lock)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Rapport lisible (toutes sévérités, y compris les avis « unmaintained »).
      - name: Scan Cargo.lock (table, informatif)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" \
            scan source --lockfile Cargo.lock --format table || true

      # Données pour la barrière ci-dessous.
      - name: Scan Cargo.lock (JSON)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" \
            scan source --lockfile Cargo.lock --format json > "$RUNNER_TEMP/osv-cargo.json" || true

      # Barrière : tout avis NON listé dans `.github/osv-allowlist.txt` fait échouer le job.
      # Pourquoi une allowlist et pas un filtre par sévérité : les avis RUSTSEC n'ont souvent
      # pas de sévérité (UNKNOWN) — un gate « HIGH/CRITICAL » les laisserait passer (leçon du
      # 20.10 : 5 avis quinn-proto invisibles). La baseline est acceptée explicitement.
      - name: Gate Cargo.lock — échec sur tout nouvel avis
        run: |
          python3 - "$RUNNER_TEMP/osv-cargo.json" "$PWD/.github/osv-allowlist.txt" <<'PY'
          import json
          import sys

          json_path, allow_path = sys.argv[1], sys.argv[2]

          try:
              data = json.load(open(json_path))
          except Exception as exc:  # scan cassé / JSON absent : on échoue bruyamment
              print(f"JSON osv illisible ({exc}) — scan considéré en échec.")
              sys.exit(1)

          accepted = set()
          for raw in open(allow_path):
              line = raw.split("#", 1)[0].strip()
              if not line:
                  continue
              parts = line.split()
              if len(parts) != 2:
                  print(f"Ligne d'allowlist invalide : {raw.rstrip()}")
                  sys.exit(1)
              accepted.add((parts[0], parts[1]))

          found = set()
          detail = {}
          for result in data.get("results", []):
              for pkg in result.get("packages") or []:
                  name = (pkg.get("package") or {}).get("name")
                  version = (pkg.get("package") or {}).get("version")
                  for vuln in pkg.get("vulnerabilities") or []:
                      key = (vuln.get("id"), name)
                      found.add(key)
                      sev = ((vuln.get("database_specific") or {}).get("severity") or "UNKNOWN").upper()
                      detail[key] = (
                          f"{sev:8} {name}@{version} {vuln.get('id')} — "
                          f"{(vuln.get('summary') or '')[:70]}"
                      )

          new = sorted(found - accepted)
          if new:
              print(f"{len(new)} avis non allowlisté(s) :")
              for key in new:
                  print(" -", detail[key])
              print()
              print(
                  "Décider : corriger, isoler (feature non compilée), ou ajouter à "
                  ".github/osv-allowlist.txt avec justification (ticket 0112)."
              )
              sys.exit(1)

          print(f"{len(found)} avis connus (allowlist), aucun nouveau.")
          PY

      # Gate actif : le lock Dart est propre (0 vuln au 2026-09-17 et au 2026-10-20).
      - name: Scan pubspec.lock (Dart)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" \
            scan source --lockfile flutter/pubspec.lock --format table
