name: Build FlowLINE Linux x64

on:
  # Build déclenché MANUELLEMENT (workflow_dispatch) : le push sur main ne
  # rebuild plus automatiquement. Lancer depuis GitHub Actions → "Run
  # workflow" → branche main quand un build est voulu.
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # FlowLINE white-label : serveurs de rendez-vous (séparés par virgule) + clé
  # publique. Déployer vers une autre infra = surcharger ces 2 vars (dispatch
  # manuel, champ "env" du job). Valeurs par défaut = infra falcon.
  RUSTDESK_RENDEZVOUS_SERVERS: "falcon.my-vth.ch"
  RUSTDESK_RS_PUB_KEY: "y7HFkRp6dnePO7+ehiUSpbhUIqAwnRYDdquULvqJQXg="
  FLOWLINE_API_SERVER: "https://api-falcon.my-vth.ch"

jobs:
  build-linux-x64:
    name: FlowLINE + Support (x86_64-unknown-linux-gnu)
    # Build self-hosted sur le laptop Lucas (runner ~/projets/actions-runner,
    # Pop!_OS 24.04). Labels = défauts du runner (matching sensible à la casse).
    # Un seul job build les 2 variantes en séquence (runner self-hosted = 1 job
    # à la fois) : le 2e build profite du cache cargo (souvent 1,3-1,5x un build
    # simple au lieu de 2x). Le bridge (flutter_rust_bridge) est commité.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          # Repos privés (flowline-hbb-common...) : GITHUB_TOKEN du job ne voit
          # que le repo courant → PAT org (secret FLOWLINE_GH_TOKEN) pour les submodules.
          token: ${{ secrets.FLOWLINE_GH_TOKEN }}

      - name: Install libunwind-dev first
        # Résout un conflit apt connu sur les runners ubuntu-22.04 : installé en
        # premier, libunwind-dev passe. En résolution groupée avec gstreamer, apt
        # échoue avec "held broken packages" (libgstreamer1.0-dev Depends libunwind-dev).
        run: sudo apt-get install -y --no-install-recommends libunwind-dev

      - name: Install apt dependencies
        # NOTE: pas de libappindicator3-dev — il conflictue avec
        # libayatana-appindicator3-1 (embarqué dans le desktop Pop!_OS 24.04).
        # libappindicator-sys 0.9.0 charge la lib à runtime (libloading), pas au
        # link : le -dev n'est pas requis, et libappindicator3.so.1 est fourni
        # par le shim ayatana déjà présent.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libasound2-dev \
            libclang-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpam0g-dev \
            libpulse-dev \
            libssl-dev \
            libva-dev \
            libvdpau-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget \
            yasm

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          # Idempotent : sur self-hosted le SDK Flutter est persisté dans le tool
          # cache entre les runs → le patch peut déjà être appliqué.
          if [[ "3.24.5" == "${{env.FLUTTER_VERSION}}" ]]; then
            if git apply --reverse --check flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null; then
              echo "Patch déjà appliqué — skip"
            else
              git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
            fi
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: linux-x64

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.tool_cache }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
            done
            exit 1
          fi
        shell: bash

      - name: Build FlowLINE (technicien)
        env:
          FLOWLINE_QUICK_SUPPORT: "0"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          ./build.py --flutter --hwcodec --unix-file-copy-paste
          test -f "flowline-${{ env.VERSION }}.deb"

      - name: Build FlowLINE Support (QuickSupport)
        env:
          FLOWLINE_QUICK_SUPPORT: "1"
          RUSTDESK_RENDEZVOUS_SERVERS: ${{ env.RUSTDESK_RENDEZVOUS_SERVERS }}
          RUSTDESK_RS_PUB_KEY: ${{ env.RUSTDESK_RS_PUB_KEY }}
          FLOWLINE_API_SERVER: ${{ env.FLOWLINE_API_SERVER }}
        run: |
          ./build.py --flutter --hwcodec --unix-file-copy-paste
          # build.py produit flowline-1.4.9.deb → renommé pour distinguer l'artifact.
          mv "flowline-${{ env.VERSION }}.deb" "flowline-support-${{ env.VERSION }}.deb"

      - name: Upload FlowLINE artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-unsigned-linux-x64-${{ env.VERSION }}
          path: flowline-${{ env.VERSION }}.deb
          retention-days: 30

      - name: Upload FlowLINE Support artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowline-support-unsigned-linux-x64-${{ env.VERSION }}
          path: flowline-support-${{ env.VERSION }}.deb
          retention-days: 30